name: Monitor de sismos (CI/CD)
run-name: "CI/CD sismos - ${{ github.event_name }} por ${{ github.actor }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    name: CI - pruebas y generacion del informe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (si existe requirements.txt)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No hay requirements.txt: el proyecto usa solo la biblioteca estandar."
          fi

      - name: Ejecutar pruebas (al menos 4, con datos de ejemplo)
        run: python -m unittest discover -v

      - name: Descargar datos actuales del USGS
        run: python descargar.py

      - name: Generar el informe (public/index.html)
        run: python analizar.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el informe como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  cd:
    name: CD - publicar en GitHub Pages
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
